<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Checklist Hosts</title>
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Checklist Hosts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#161616;overflow:hidden}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);box-sizing:border-box}
  iframe{display:block;border:0;width:100%;height:100%;background:#161616}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        color:#c4a062;font:500 15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;
        background:#161616;transition:opacity .4s}
  #load img{width:84px;height:84px;border-radius:20px}
  #load.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div>CHECKLIST HOSTS</div></div>
<iframe id="app" title="Checklist Hosts" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbyC9cOw3sSrlcew2fJ1SueoOYxYaFlovzVl9oaE0LgQA5DEIuPEpq6JnqRebnE5njg2/exec"></iframe>
<script>
  var l=document.getElementById('load');
  document.getElementById('app').addEventListener('load',function(){l.classList.add('off')});
  setTimeout(function(){l.classList.add('off')},8000);
</script>
</body>
</html>
